  <style>
    :root{
      --brand:#000000;
      --ink:#1f2937;
      --bg:#f7fafc;
      --card:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family: ui-sans-serif,system-ui,"Noto Sans TC",Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--ink);
      line-height:1.6;
    }
    header{
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.06);
      position:sticky;
      top:0;
      z-index:10;
    }
    nav{
      max-width:960px;
      margin:auto;
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{display:flex;align-items:center;gap:10px;color:var(--brand);font-weight:800;text-decoration:none}
    .brand img{width:34px;height:34px;border-radius:8px;object-fit:cover}
    .back-link{color:var(--brand);text-decoration:none;font-weight:600}
    main{max-width:720px;margin:auto;padding:24px 16px}
    h1{margin-top:0;color:var(--brand);font-size:22px}
    p.sub{color:#64748b;margin-top:4px;margin-bottom:20px}

    /* 卡片列表 */
    .link-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:10px;
}

/* 1) 卡片高度靠 padding 控，給上下留白；flex 置中整排內容 */
/* 把每一列改成三欄：左 icon / 中文字 / 右保留位（…） */
.link-item{
  display:grid;
  grid-template-columns: 56px 1fr 56px;  /* 左右固定 56px，中間自動撐滿 */
  align-items:center;                    /* 垂直置中 */
  gap:0;                                 /* 三欄已對齊，不需要額外 gap */
  padding:10px 12px;
  border:2px solid #1f7a8c;
  border-radius:14px;
  background:#fff;
  transition:all .15s ease;
  text-decoration:none;
  color:#1f2937;
}

/* 左側 icon：40x40 放在 56px 欄位內，左右各留 8px 呼吸 */
.link-icon{
  width:40px; height:40px;
  justify-self:start;
  border-radius:10px;
  object-fit:cover;
  background:#eef2f7;
  display:block;
}

/* 中間文字：真正水平「置中」在整張卡的中心線上 */
.link-text{
  justify-self:center;     /* 關鍵：讓文字在中間那欄居中 */
  text-align:center;
  line-height:1;
  font-weight:700;
  font-size:16px;
  color:#1f2937;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}



/* Hover / Focus 保留你的互動感 */
.link-item:hover{
  background:#f0fafb;
  border-color:#176070;
  box-shadow:0 4px 10px rgba(31,122,140,0.10);
  transform:translateY(-2px);
}
.link-item:focus-visible{
  outline:3px solid rgba(31,122,140,.35);
  outline-offset:2px;
}




    .link-info strong{font-size:16px;color:#1f2937}
    .link-info small{display:block;color:#64748b;font-size:14px;margin-top:2px}
    .arrow{font-size:18px;color:var(--brand)}
    footer{
      text-align:center;
      font-size:14px;
      color:#64748b;
      margin-top:40px;
      padding:16px 0;
    }

    .nav-buttons {
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-link,
.home-link {
  text-decoration: none;
  color: #1f7a8c;
  font-weight: 600;
  background: #f0f9fb;
  border: 1.5px solid #1f7a8c;
  padding: 6px 12px;
  border-radius: 8px;
  transition: all 0.15s ease;
}

.back-link:hover,
.home-link:hover {
  background: #1f7a8c;
  color: #fff;
}

/* 修正右上按鈕在小螢幕會爆出去 */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.nav-actions {
  display: flex;
  gap: 8px;
  min-width: 0;
  flex-shrink: 1;     /* 允許縮小 */
  overflow: hidden;  /* 防止爆出去 */
}

.nav-actions a {
  padding: 6px 10px;
  font-size: 14px;
  white-space: nowrap; /* 不換行 */
  flex-shrink: 1;      /* 允許縮小 */
  min-width: 0;
}

/* === Pass 單列：文字+按鈕整排置中 === */
.link-item.pass-card{
  padding:10px 12px;
}

.pass-row{
  display:flex;
  align-items:center;
  justify-content:center; /* ✅ 置中整排 */
  gap:12px;
  width:100%;
}

/* 標題 */
.pass-title{
  font-weight:800;
  font-size:15px;
  white-space:nowrap;
}

/* 按鈕列：桌機維持一排，置中 */
.pass-actions{
  display:flex;
  gap:8px;
  justify-content:center;  /* ✅ 按鈕也置中 */
  flex-wrap:nowrap;        /* 桌機不換行 */
}

/* 小格子按鈕 */
.pass-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  font-size:13px;
  border-radius:12px;
  border:1.5px solid rgba(0,0,0,.12);
  background:#fff;
  color:#1f7a8c;
  text-decoration:none;
  transition:.15s;
}
.pass-btn.primary{
  background:#1f7a8c;
  border-color:#1f7a8c;
  color:#fff;
}
.pass-btn:hover{
  background:#f0f9fb;
  border-color:#1f7a8c;
  transform:translateY(-1px);
}
.pass-btn.primary:hover{
  background:#176070;
}

/* ✅ 手機：不要拖動 → 允許自動換行 + 縮小按鈕 */
@media (max-width:420px){
  .pass-row{
    flex-wrap:wrap;          /* ✅ 允許換行，避免超出 */
    gap:8px;
  }
  .pass-actions{
    flex-wrap:wrap;          /* ✅ 按鈕可換行 */
    justify-content:center;  /* ✅ 換行後仍置中 */
    gap:6px;
  }
  .pass-title{
    font-size:13px;
  }
  .pass-btn{
    font-size:11px;          /* ✅ 按鈕字縮小 */
    padding:4px 6px;         /* ✅ 按鈕變瘦 */
    border-radius:9px;
    white-space:nowrap;
    flex:0 1 auto;           /* ✅ 允許按鈕縮小 */
    min-width:0;
  }
}

/* 更窄的手機（像 iPhone SE）再壓一次 */
@media (max-width:360px){
  .pass-title{ font-size:13px; }
  .pass-btn{ font-size:11px; padding:4px 7px; }
}

/* 非主按鈕：改成跟 ticket.html 一樣的「連結藍」 */
.pass-btn:not(.primary){
  color:#0000EE;   /* 瀏覽器預設藍，最像你截圖那種 */
}
